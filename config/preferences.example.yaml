# 复制为 preferences.yaml 后生效；所有字段可省略，路径相对项目根目录。
language: auto # 跟随请求语言，也可用 zh-CN、en 等语言标签。

github: {}
# github:
#   owner: your-account

showcase:
  enabled: true
  frontend: auto
  frontend_policy: prefer_jd # prefer_jd | prefer_config；auto 不指定技术。
  backend: auto
  publish: local # local | public | private
  pages: true # 仅在已开启发布、适合静态演示且访问范围获准时部署。
  notes: [] # 条件偏好，用自然语言填写。

resume:
  enabled: true # 完整 JD 后联动简历；不影响明确的独立简历请求。
  references: []
  notes: []
  # 可选资料路径，配置不代表授权修改来源。
  # base_en: Resume/private/resume-base.html
  # base_zh: Resume/private/resume-base-zh.html
  # primary_language: en # en | zh；未指定主源时省略。
